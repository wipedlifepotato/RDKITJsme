# Nginx конфигурация для SMILES API Rdkit
# Разместить в /etc/nginx/sites-available/ или /etc/nginx/conf.d/

server {
    listen 80;
    server_name your-domain.com;  # Заменить на свой домен или IP

    # Основной клиент (JSME) по /
    location / {
        proxy_pass http://127.0.0.1:1235;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API доступно по /api/ и /rdkit/api/
    location /api/ {
        proxy_pass http://127.0.0.1:1235;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rdkit/api/ {
        proxy_pass http://127.0.0.1:1235;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger UI и ReDoc
    location /docs {
        proxy_pass http://127.0.0.1:1235;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:1235;
    }

    # Статические файлы (JSME, 3Dmol.js)
    location /StaticFiles/ {
        proxy_pass http://127.0.0.1:1235;
    }
}

# Альтернативная конфигурация: API доступно по / (без префикса)
# Использовать если API должно быть доступно напрямую по корню
server {
    listen 8080;
    server_name api.your-domain.com;  # Отдельный домен для API

    location / {
        proxy_pass http://127.0.0.1:1235;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
