<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚗️</text></svg>">
<title>Периодическая таблица — справочник</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #1a1a2e;
    color: #eee;
    padding: 15px;
    min-height: 100vh;
}
h1 { text-align: center; margin-bottom: 10px; font-size: 1.4rem; color: #fff; }
h2 { font-size: 1rem; margin: 15px 0 8px; color: #a29bfe; }

.legend {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    margin-bottom: 15px; font-size: 0.75rem;
}
.legend-item {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 4px; background: #16213e;
}
.legend-color { width: 12px; height: 12px; border-radius: 2px; }

.table-wrap { overflow-x: auto; margin-bottom: 20px; }
table { border-collapse: collapse; margin: 0 auto; }
td {
    width: 52px; height: 52px; padding: 2px;
    vertical-align: top; text-align: center;
    border: 1px solid #333; border-radius: 3px;
    cursor: pointer; font-size: 0.65rem;
    transition: transform 0.1s, box-shadow 0.1s;
    position: relative;
}
td:hover { transform: scale(1.15); z-index: 10; box-shadow: 0 0 10px rgba(255,255,255,0.3); }
td.empty { border: none; cursor: default; background: transparent; }
td.empty:hover { transform: none; box-shadow: none; }
.z { font-size: 0.6rem; color: rgba(255,255,255,0.7); display: block; }
.sym { font-size: 0.9rem; font-weight: bold; display: block; }
.name { font-size: 0.5rem; color: rgba(255,255,255,0.6); display: block; }
.mass { font-size: 0.5rem; color: rgba(255,255,255,0.5); display: block; }

.cat-alkali { background: #c0392b; }
.cat-alkaline { background: #e67e22; }
.cat-transition { background: #2980b9; }
.cat-post { background: #27ae60; }
.cat-metalloid { background: #f39c12; }
.cat-nonmetal { background: #2ecc71; }
.cat-halogen { background: #e74c3c; }
.cat-noble { background: #8e44ad; }
.cat-lanth { background: #d35400; }
.cat-actin { background: #7f8c8d; }

.f-block { margin-top: 15px; }
.f-block td { width: 52px; height: 52px; }

#detail {
    position: fixed; top: 0; right: -400px; width: 380px; height: 100vh;
    background: #16213e; border-left: 2px solid #a29bfe;
    padding: 20px; overflow-y: auto; transition: right 0.3s; z-index: 100;
}
#detail.open { right: 0; }
#detail h2 { color: #fff; font-size: 1.3rem; margin-bottom: 5px; }
#detail .close {
    position: absolute; top: 10px; right: 15px; font-size: 1.5rem;
    cursor: pointer; color: #a29bfe;
}
#detail .row { margin: 8px 0; font-size: 0.85rem; }
#detail .label { color: #a29bfe; font-weight: bold; }
#detail .val { color: #fff; }
.config-box {
    background: #0f3460; padding: 10px; border-radius: 5px;
    font-family: monospace; font-size: 0.8rem; margin: 8px 0;
    white-space: pre-wrap; word-break: break-all;
}
.spin-box {
    background: #0f3460; padding: 10px; border-radius: 5px;
    font-size: 1.2rem; margin: 8px 0; letter-spacing: 2px;
}

.triads { margin-top: 20px; }
.triad-group {
    background: #16213e; padding: 10px 15px; border-radius: 5px;
    margin: 5px 0; font-size: 0.85rem;
}
.triad-group .triad-title { color: #a29bfe; font-weight: bold; }
.triad-group .triad-elems { color: #fff; margin-top: 3px; }

.filters { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 15px; }
.filter-btn {
    padding: 4px 10px; border: 1px solid #a29bfe; border-radius: 15px;
    background: transparent; color: #a29bfe; cursor: pointer; font-size: 0.75rem;
    transition: all 0.2s;
}
.filter-btn.active, .filter-btn:hover { background: #a29bfe; color: #1a1a2e; }

.lang-bar {
    display: flex; gap: 5px; justify-content: center; margin-bottom: 10px;
}
.lang-btn {
    padding: 4px 12px; border: 1px solid #a29bfe; border-radius: 15px;
    background: transparent; color: #a29bfe; cursor: pointer; font-size: 0.75rem;
    transition: all 0.2s;
}
.lang-btn.active, .lang-btn:hover { background: #a29bfe; color: #1a1a2e; }

@media (max-width: 768px) {
    td { width: 40px; height: 40px; font-size: 0.55rem; }
    .sym { font-size: 0.75rem; }
    #detail { width: 100vw; right: -100vw; }
}
</style>
</head>

<div class="filters" id="filters"></div>

<div class="table-wrap">

</div>

<div class="f-block">

let currentLang = localStorage.getItem('pt_lang') || 'ru';
function t(key) { return (I18N[currentLang] && I18N[currentLang][key]) || I18N['ru'][key] || key; }

function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === currentLang);
    });
}

function buildLangBar() {
    const bar = document.getElementById('lang-bar');
    const langs = ['ru', 'en', 'uk', 'es'];
    let html = '';
    langs.forEach(l => {
        html += `<button class="lang-btn${l===currentLang?' active':''}" data-lang="${l}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`;
    });
    bar.innerHTML = html;
}

function setLang(l) {
    currentLang = l;
    localStorage.setItem('pt_lang', l);
    applyI18n();
    buildFilters();
    buildTriads();
}

function buildTable() {
    const table = document.getElementById('main-table');
    let html = '';
    for (let p = 1; p <= 7; p++) {
        html += '<tr>';
        for (let c = 1; c <= 18; c++) {
            const z = Object.keys(POS).find(k => POS[k][0] === p && POS[k][1] === c);
            if (z) {
                const d = E[z];
                html += `<td class="cat-${d[7]}" onclick="showDetail(${z})">
                    <span class="z">${d[0]}</span>
                    <span class="sym">${d[1]}</span>
                    <span class="name">${d[2]}</span>
                    <span class="mass">${d[3]}</span>
                </td>`;
            } else {
                html += '<td class="empty"></td>';
            }
        }
        html += '</tr>';
    }
    table.innerHTML = html;

    const lanth = document.getElementById('lanth-table');
    let lhtml = '<tr>';
    LANTH.forEach(z => {
        const d = E[z];
        lhtml += `<td class="cat-${d[7]}" onclick="showDetail(${z})">
            <span class="z">${d[0]}</span>
            <span class="sym">${d[1]}</span>
            <span class="name">${d[2]}</span>
            <span class="mass">${d[3]}</span>
        </td>`;

            <span class="mass">${d[3]}</span>

    ahtml += '</tr>';
    actin.innerHTML = ahtml;
}

function showDetail(z) {
    const d = E[z];
    const detail = document.getElementById('detail');
    const content = document.getElementById('detail-content');
    
    const catNames = {
        alkali:'alkali', alkaline:'alkaline',
        transition:'transition', post:'post',
        metalloid:'metalloid', nonmetal:'nonmetal',
        halogen:'halogen', noble:'noble',
        lanth:'lanth', actin:'actin'
    };

    content.innerHTML = `
        <h2>${d[2]} (${d[1]})</h2>
        <div class="row"><span class="label">${t('atomic_number')}:</span> <span class="val">${d[0]}</span></div>

    document.getElementById('detail').classList.remove('open');
}

function buildTriads() {
    const list = document.getElementById('triads-list');
    let html = '';
    TRIADS.forEach(tr => {
        const elems = tr.elems.map(z => `${E[z][1]} (${E[z][2]})`).join(' — ');
        html += `<div class="triad-group">
            <div class="triad-title">${t(tr.name)}</div>
            <div class="triad-elems">${elems}</div>
        </div>`;
    });
    list.innerHTML = html;
}

    ];
    let html = '';
    cats.forEach(([key, labelKey]) => {
        html += `<button class="filter-btn" onclick="filterCat('${key}', this)">${t(labelKey)}</button>`;
    });
    filters.innerHTML = html;
}

function filterCat(cat, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    document.querySelectorAll('td[class^="cat-"]').forEach(td => {
        if (cat === 'all') {
            td.style.opacity = '1';
        } else {
            td.style.opacity = td.classList.contains('cat-' + cat) ? '1' : '0.15';
        }
    });
}

buildLangBar();
applyI18n();
buildTable();
buildTriads();
buildFilters();
</script>
